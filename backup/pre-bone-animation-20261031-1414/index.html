<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#04060b" />
    <meta name="description" content="星見町 2丁目·HOSHIZORA MART：可自由环绕、缩放并第三人称漫游的雨夜便利店 Three.js 微缩模型。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b12'/%3E%3Cpath d='M32 10l5.6 15.2L54 27l-12.4 9.2L45.4 54 32 43.6 18.6 54l3.8-17.8L10 27l16.4-1.8z' fill='%23ffb66d'/%3E%3C/svg%3E" />
    <title>星見町 2丁目 — HOSHIZORA MART</title>
    <link rel="preload" href="/models/rainy_konbini.glb" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" tabindex="0" aria-label="雨夜便利店第三人称漫游。左键旋转，右键平移，滚轮缩放，WASD 或方向键移动，双击或 R 回到起点，H 隐藏界面。"></canvas>

    <div id="loader" aria-live="polite">
      <div class="loader-inner">
        <div class="loader-kicker">A SMALL WORLD, AFTER RAIN</div>
        <h1 class="loader-title">星見町 <span>2丁目</span></h1>
        <div class="loader-brand">HOSHIZORA MART <i>·</i> 24H</div>
        <div class="loader-track"><div id="loader-bar"></div></div>
        <div class="loader-foot"><span id="loader-status">正在构建雨夜街角</span><span id="loader-pct">0%</span></div>
      </div>
    </div>

    <div id="veil"></div>

    <header id="hud" class="hud">
      <div class="brand">
        <div class="brand-jp">星見町 <span>2丁目</span></div>
        <div class="brand-en">HOSHIZORA MART <i>·</i> RAINY CORNER</div>
      </div>
      <div class="meta">
        <span class="meta-dot"></span>
        <span>雨 / 24H</span>
        <span class="meta-sep">|</span>
        <span>THREE.JS DIORAMA</span>
      </div>
    </header>

    <footer id="foot" class="foot hud">
      <div class="hint">
        <span>左键旋转</span><b>·</b><span>右键平移</span><b>·</b><span>滚轮缩放</span>
      </div>
      <div class="foot-note">WASD / ↑↓←→ 移动 <b>·</b> R 回起点 <b>·</b> H 隐藏界面</div>
    </footer>

    <div id="error" class="error" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
